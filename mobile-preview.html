<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — 设备预览</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1e;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #27272a;
      border-bottom: 1px solid #3f3f46;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .toolbar label { font-size: 12px; color: #a1a1aa; }
    .toolbar select,
    .toolbar input {
      background: #18181b;
      border: 1px solid #52525b;
      color: #fafafa;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
    }
    .toolbar input[type="text"] { width: 220px; }
    .toolbar button {
      background: #3f3f46;
      border: none;
      color: #fafafa;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .toolbar button:hover { background: #52525b; }
    .toolbar button.active { background: #ec4899; color: #fff; }
    .routes { display: flex; flex-wrap: wrap; gap: 6px; }
    .meta {
      margin-left: auto;
      font-size: 11px;
      color: #71717a;
      font-family: ui-monospace, monospace;
      line-height: 1.45;
      text-align: right;
    }
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
    }
    .device-wrap {
      transform-origin: center center;
      transition: transform 0.2s ease;
    }
    .device {
      background: #0a0a0a;
      border-radius: 44px;
      padding: 12px;
      box-shadow:
        0 0 0 2px #3f3f46,
        0 24px 80px rgba(0, 0, 0, 0.55),
        inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      position: relative;
    }
    .device.tablet { border-radius: 24px; padding: 16px; }
    .device.desktop-frame {
      border-radius: 12px;
      padding: 8px;
      background: #18181b;
    }
    .device-notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      background: #0a0a0a;
      border-radius: 0 0 18px 18px;
      z-index: 5;
      pointer-events: none;
    }
    .device.tablet .device-notch,
    .device.desktop-frame .device-notch { display: none; }
    .screen {
      overflow: hidden;
      background: #fff;
      border-radius: 32px;
      display: flex;
      flex-direction: column;
    }
    .device.tablet .screen { border-radius: 12px; }
    .device.desktop-frame .screen { border-radius: 6px; }

    /* ── Browser chrome ── */
    .browser-shell {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f2f2f7;
    }
    .browser-shell.hidden { display: none; }

    .browser-top {
      flex-shrink: 0;
      background: #f2f2f7;
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.12);
    }
    .browser-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 28px;
      padding: 0 18px;
      font-size: 12px;
      font-weight: 600;
      color: #000;
      letter-spacing: -0.02em;
    }
    .browser-status__left { font-variant-numeric: tabular-nums; }
    .browser-status__right {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .browser-status__right svg { display: block; }

    .browser-url-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px 8px;
    }
    .browser-url {
      flex: 1;
      min-width: 0;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 10px;
      border: 0.5px solid rgba(0, 0, 0, 0.08);
      font-size: 13px;
      color: #3c3c43;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .browser-url svg { flex-shrink: 0; opacity: 0.45; }
    .browser-url span { overflow: hidden; text-overflow: ellipsis; }

    .browser-viewport {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #fafafa;
    }

    .browser-bottom {
      flex-shrink: 0;
      background: #f9f9f9;
      border-top: 0.5px solid rgba(0, 0, 0, 0.12);
    }
    .browser-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: 49px;
      padding: 0 8px;
      color: #007aff;
    }
    .browser-toolbar svg { display: block; }
    .browser-toolbar .disabled { color: #c7c7cc; }
    .browser-home-indicator {
      height: 21px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
    }
    .browser-home-indicator span {
      width: 134px;
      height: 5px;
      border-radius: 3px;
      background: #000;
      opacity: 0.18;
    }

    /* Chrome iOS */
    .browser-shell--chrome .browser-top {
      background: #fff;
      border-bottom-color: rgba(0, 0, 0, 0.08);
    }
    .browser-shell--chrome .browser-url-row {
      padding: 8px 12px 10px;
    }
    .browser-shell--chrome .browser-url {
      justify-content: flex-start;
      border-radius: 999px;
      background: #f1f3f4;
      border: none;
      height: 38px;
      font-size: 14px;
    }
    .browser-shell--chrome .browser-bottom {
      background: #fff;
    }
    .browser-shell--chrome .browser-toolbar {
      height: 44px;
      color: #5f6368;
    }
    .browser-shell--chrome .browser-toolbar .active { color: #1a73e8; }

    .plain-viewport {
      overflow: hidden;
      background: #fafafa;
    }
    .plain-viewport.hidden { display: none; }

    iframe {
      display: block;
      border: none;
      background: #fafafa;
    }
    .hint {
      text-align: center;
      padding: 8px 16px 16px;
      font-size: 11px;
      color: #71717a;
      line-height: 1.5;
    }
    .scale-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .scale-row input[type="range"] { width: 100px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <label>设备</label>
    <select id="device">
      <option value="iphone17">iPhone 17 Pro (430×932)</option>
      <option value="iphone15">iPhone 15 / 14 (390×844)</option>
      <option value="iphoneSE">iPhone SE (375×667)</option>
      <option value="ipadMini">iPad Mini (744×1133)</option>
      <option value="ipad">iPad (820×1180)</option>
      <option value="desktop">Desktop 1280×800</option>
      <option value="custom">自定义</option>
    </select>

    <label>浏览器</label>
    <select id="browser">
      <option value="none">无（全屏 iframe）</option>
      <option value="safari" selected>Safari iOS</option>
      <option value="chrome">Chrome iOS</option>
    </select>

    <label>宽</label>
    <input type="number" id="w" value="430" min="320" max="1600" />
    <label>高</label>
    <input type="number" id="h" value="932" min="480" max="1200" />

    <button id="rotate" type="button" title="横竖屏切换">↻ 旋转</button>

    <div class="scale-row">
      <label>缩放</label>
      <input type="range" id="scale" min="40" max="100" value="85" />
      <span id="scaleVal">85%</span>
    </div>

    <label>URL</label>
    <input type="text" id="base" value="http://localhost:3000" />

    <div class="routes">
      <button type="button" data-path="/" class="route active">首页</button>
      <button type="button" data-path="/category/ai" class="route">AI</button>
      <button type="button" data-path="/category/product" class="route">Product</button>
      <button type="button" data-path="/category/photo" class="route">Photo</button>
      <button type="button" data-path="/" class="route">About</button>
    </div>

    <button id="reload" type="button">刷新 iframe</button>
    <span class="meta" id="meta">430 × 932</span>
  </div>

  <div class="stage">
    <div class="device-wrap" id="wrap">
      <div class="device" id="shell">
        <div class="device-notch" id="notch"></div>
        <div class="screen" id="screen">
          <!-- Safari / Chrome chrome -->
          <div class="browser-shell browser-shell--safari" id="browserShell">
            <div class="browser-top">
              <div class="browser-status">
                <span class="browser-status__left">9:41</span>
                <span class="browser-status__right" aria-hidden="true">
                  <svg width="17" height="11" viewBox="0 0 17 11"><path fill="currentColor" d="M1 7.5h2v3H1zm4-2h2v5H5zm4-3h2v8H9zm4 2h2v6h-2z"/></svg>
                  <svg width="16" height="11" viewBox="0 0 16 11"><path fill="currentColor" d="M8 2.2C10.4 2.2 12.5 3.2 14 4.9 14.3 5.2 14.8 5.2 15.1 4.9 15.4 4.6 15.4 4.1 15.1 3.8 13.2 1.8 10.7.7 8 .7S2.8 1.8.9 3.8C.6 4.1.6 4.6.9 4.9 1.2 5.2 1.7 5.2 2 4.9 3.5 3.2 5.6 2.2 8 2.2zm0 3.2c1.3 0 2.5.5 3.4 1.4.3.3.8.3 1.1 0 .3-.3.3-.8 0-1.1C11.2 4.8 9.7 4.1 8 4.1S4.8 4.8 3.5 5.7c-.3.3-.3.8 0 1.1.3.3.8.3 1.1 0 .9-.9 2.1-1.4 3.4-1.4zm0 3.1c.8 0 1.4.6 1.4 1.4s-.6 1.4-1.4 1.4-1.4-.6-1.4-1.4.6-1.4 1.4-1.4z"/></svg>
                  <svg width="25" height="11" viewBox="0 0 25 11"><rect x="0" y="1" width="21" height="9" rx="2.2" fill="none" stroke="currentColor" stroke-width="1"/><rect x="22" y="3.5" width="2" height="4" rx="1" fill="currentColor" opacity=".35"/><rect x="1.5" y="2.5" width="16" height="6" rx="1.2" fill="currentColor"/></svg>
                </span>
              </div>
              <div class="browser-url-row">
                <div class="browser-url" id="browserUrlBar">
                  <svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><path fill="currentColor" d="M6 0 0 6.5V14h3V8h6v6h3V6.5L6 0z"/></svg>
                  <span id="browserUrlText">xujuntan.com</span>
                </div>
              </div>
            </div>
            <div class="browser-viewport">
              <iframe id="frameBrowser" src="http://localhost:3000/" title="Portfolio preview"></iframe>
            </div>
            <div class="browser-bottom">
              <div class="browser-toolbar" id="browserToolbar">
                <!-- filled by JS per browser -->
              </div>
              <div class="browser-home-indicator"><span></span></div>
            </div>
          </div>

          <!-- plain full-screen iframe -->
          <div class="plain-viewport hidden" id="plainViewport">
            <iframe id="framePlain" src="about:blank" title="Portfolio preview" tabindex="-1" hidden></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p class="hint">
    先运行 <code>npm run dev</code>。默认模拟 <strong>Safari iOS</strong> 地址栏 + 底部 Tab 栏占用后的真实可视区域。
    切换「Chrome iOS」可对比另一套浏览器 chrome 高度。
  </p>

  <script>
    const PRESETS = {
      iphone17: { w: 430, h: 932, phone: true },
      iphone15: { w: 390, h: 844, phone: true },
      iphoneSE: { w: 375, h: 667, phone: true },
      ipadMini: { w: 744, h: 1133, tablet: true },
      ipad: { w: 820, h: 1180, tablet: true },
      desktop: { w: 1280, h: 800, desktop: true },
    };

    /** Top + bottom chrome height (px) — bars visible, portrait phone */
    const BROWSER_CHROME = {
      safari: { top: 76, bottom: 70, label: "Safari iOS" },
      chrome: { top: 72, bottom: 64, label: "Chrome iOS" },
      safariTablet: { top: 64, bottom: 0, label: "Safari iPad" },
      chromeTablet: { top: 60, bottom: 0, label: "Chrome iPad" },
    };

    const SAFARI_TOOLBAR = `
      <svg class="disabled" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      <svg class="disabled" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    `;

    const CHROME_TOOLBAR = `
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      <svg class="active" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
    `;

    const deviceEl = document.getElementById("device");
    const browserEl = document.getElementById("browser");
    const wEl = document.getElementById("w");
    const hEl = document.getElementById("h");
    const frameBrowser = document.getElementById("frameBrowser");
    const framePlain = document.getElementById("framePlain");
    const baseEl = document.getElementById("base");
    const shell = document.getElementById("shell");
    const notch = document.getElementById("notch");
    const wrap = document.getElementById("wrap");
    const scaleEl = document.getElementById("scale");
    const scaleVal = document.getElementById("scaleVal");
    const meta = document.getElementById("meta");
    const browserShell = document.getElementById("browserShell");
    const plainViewport = document.getElementById("plainViewport");
    const browserToolbar = document.getElementById("browserToolbar");
    const browserUrlText = document.getElementById("browserUrlText");
    const screenEl = document.getElementById("screen");
    let currentPath = "/";

    function activeFrame() {
      return browserEl.value === "none" ? framePlain : frameBrowser;
    }

    function isTabletOrDesktop() {
      const p = PRESETS[deviceEl.value];
      return !!(p && (p.tablet || p.desktop));
    }

    function chromeInsets() {
      const mode = browserEl.value;
      if (mode === "none") return { top: 0, bottom: 0, label: "全屏" };
      const tablet = isTabletOrDesktop();
      if (mode === "safari") return tablet ? BROWSER_CHROME.safariTablet : BROWSER_CHROME.safari;
      return tablet ? BROWSER_CHROME.chromeTablet : BROWSER_CHROME.chrome;
    }

    function displayUrl() {
      try {
        const u = new URL(baseEl.value.replace(/\/$/, "") + currentPath);
        return u.hostname + u.pathname.replace(/\/$/, "") + (u.search || "");
      } catch {
        return "localhost";
      }
    }

    function applyBrowserUi() {
      const mode = browserEl.value;
      const tablet = isTabletOrDesktop();

      if (mode === "none") {
        browserShell.classList.add("hidden");
        plainViewport.classList.remove("hidden");
        framePlain.hidden = false;
        return;
      }

      browserShell.classList.remove("hidden");
      plainViewport.classList.add("hidden");
      framePlain.hidden = true;

      browserShell.classList.toggle("browser-shell--safari", mode === "safari");
      browserShell.classList.toggle("browser-shell--chrome", mode === "chrome");
      browserToolbar.innerHTML = mode === "safari" ? SAFARI_TOOLBAR : CHROME_TOOLBAR;
      browserUrlText.textContent = displayUrl();

      const homeIndicator = browserShell.querySelector(".browser-home-indicator");
      if (homeIndicator) {
        homeIndicator.style.display = tablet ? "none" : "flex";
      }
    }

    function applySize() {
      const w = Number(wEl.value);
      const h = Number(hEl.value);
      const insets = chromeInsets();
      const viewportH = Math.max(200, h - insets.top - insets.bottom);
      const viewportW = w;

      screenEl.style.width = w + "px";
      screenEl.style.height = h + "px";

      if (browserEl.value === "none") {
        framePlain.width = viewportW;
        framePlain.height = viewportH;
        meta.innerHTML =
          "屏幕 " + w + " × " + h + "<br>viewport " + viewportW + " × " + viewportH + "（全屏）";
      } else {
        browserShell.style.width = w + "px";
        browserShell.style.height = h + "px";
        frameBrowser.width = viewportW;
        frameBrowser.height = viewportH;
        meta.innerHTML =
          "屏幕 " + w + " × " + h + "<br>viewport " + viewportW + " × " + viewportH +
          "<br>chrome −" + insets.top + " / −" + insets.bottom + "（" + insets.label + "）";
      }

      browserUrlText.textContent = displayUrl();

      const pct = Number(scaleEl.value);
      scaleVal.textContent = pct + "%";
      wrap.style.transform = "scale(" + pct / 100 + ")";
    }

    function applyDeviceClass() {
      const p = PRESETS[deviceEl.value];
      shell.classList.remove("tablet", "desktop-frame");
      notch.style.display = p && p.phone ? "block" : "none";
      if (p && p.tablet) shell.classList.add("tablet");
      if (p && p.desktop) shell.classList.add("desktop-frame");
    }

    function navigate(path) {
      currentPath = path;
      const url = baseEl.value.replace(/\/$/, "") + currentPath;
      frameBrowser.src = url;
      framePlain.src = url;
      browserUrlText.textContent = displayUrl();
    }

    deviceEl.addEventListener("change", () => {
      const p = PRESETS[deviceEl.value];
      if (p) {
        wEl.value = p.w;
        hEl.value = p.h;
      }
      applyDeviceClass();
      applyBrowserUi();
      applySize();
    });

    browserEl.addEventListener("change", () => {
      const url = baseEl.value.replace(/\/$/, "") + currentPath;
      applyBrowserUi();
      activeFrame().src = url;
      applySize();
    });

    [wEl, hEl].forEach((el) =>
      el.addEventListener("input", () => {
        deviceEl.value = "custom";
        applySize();
      })
    );

    document.getElementById("rotate").addEventListener("click", () => {
      const w = Number(wEl.value);
      const h = Number(hEl.value);
      wEl.value = h;
      hEl.value = w;
      deviceEl.value = "custom";
      applySize();
    });

    scaleEl.addEventListener("input", applySize);

    document.querySelectorAll(".route").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".route").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        navigate(btn.dataset.path);
      });
    });

    document.getElementById("reload").addEventListener("click", () => navigate(currentPath));
    baseEl.addEventListener("change", () => navigate(currentPath));

    applyDeviceClass();
    applyBrowserUi();
    applySize();
  </script>
</body>
</html>
